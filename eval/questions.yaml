  path: sql
  tags: [cross_season, unstable_names]
  why: "web_name varies (\"Virgil\", \"van Dijk\", \"Van Dijk\"); counting seasons he was merely listed is also wrong."

- id: q15
  question: "Who are the top 5 goalscorers across all seasons in the data?"
  answer_type: ranking
  top: 5
  gold_sql: |
    select player_code, sum(goals) as value from marts.fct_player_fixtures
    group by player_code order by value desc
  path: metrics
  tags: [cross_season, unstable_names]
  why: "Needs the stable player key across seasons."

- id: q16
  question: "Which player has played for the most different Premier League clubs in this data (at least one minute for each)?"
  answer_type: set
  gold_sql: |
    with clubs as (
      select player_code, count(distinct team_name) as value from marts.fct_player_fixtures
      where minutes_played > 0 group by player_code)
    select player_code, value from clubs where value = (select max(value) from clubs)
  path: sql
  tags: [cross_season, transfers, ties]
  why: "No metric covers it; needs per-fixture clubs and may have ties."

- id: q17
  question: "In which season did Mohamed Salah score the most FPL points?"
  answer_type: text
  gold_sql: |
    select season as value from marts.fct_player_fixtures where player_code = 118748
    group by season order by sum(total_points) desc limit 1
  path: metrics
  tags: [cross_season]
  why: "Simple once the player is resolved."

# ---------------------------------------------------------------- name resolution
- id: q18
  question: "How many FPL points has Pascal Gross scored in total?"
  answer_type: number
  gold_sql: select sum(total_points) as value from marts.fct_player_fixtures where player_code = 60307
