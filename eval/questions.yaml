# ---------------------------------------------------------------- ties and extremes
- id: q48
  question: "Which goalkeeper kept the most clean sheets in 2024-25?"
  answer_type: set
  gold_sql: |
    with cs as (
      select player_code, sum(clean_sheets) as value from marts.fct_player_fixtures
      where season = '2024-25' and position = 'GKP' group by player_code)
    select player_code, value from cs where value = (select max(value) from cs)
  path: metrics
  tags: [ties]
  why: "Raya and Sels are tied on 13. Naming only one is half right."

- id: q49
  question: "What is the biggest winning margin in any match in this data, and how many matches ended with that margin?"
  answer_type: table
  gold_sql: |
    with m as (select abs(home_goals - away_goals) as margin from marts.fct_fixtures)
    select 'margin' as key, max(margin) as value from m
    union all
    select 'matches', count(*) from m where margin = (select max(margin) from m)
  path: sql
  tags: [ties]
  why: "Three 9-0s (Leicester at Southampton, Liverpool v Bournemouth, Man Utd v Southampton)."

# ---------------------------------------------------------------- time
- id: q50
  question: "In which calendar month of the 2023-24 season did Arsenal players score the most FPL points? Answer as YYYY-MM."
  answer_type: text
  gold_sql: |
    select strftime(kickoff_date, '%Y-%m') as value from marts.fct_player_fixtures
    where season = '2023-24' and team_name = 'Arsenal'
    group by 1 order by sum(total_points) desc limit 1
  path: metrics
  tags: [time_grain]
  why: "Calendar month, not gameweek or season."

# Tags
#   warmup            should be easy everywhere; catches harness problems
#   cross_season      one person across seasons; per-season ids and display names change
#   unstable_names    display name changes (Salah -> M.Salah)
#   name_mismatch     the user's name for it differs from the data's (Groß, Man Utd, full names)
#   ambiguous_match   a fuzzy match also hits someone else
#   ambiguous_person  two different people with the same name
#   grain             rows aren't the unit asked about (player x match vs match vs gameweek)
#   double_gameweek   a gameweek with two matches for a team
#   blank_gameweek    a gameweek with no matches
#   team_vs_player    team facts must come from matches, not by summing players
#   own_goals         team goals include opponents' own goals
#   transfers         club per match, not end-of-season club
#   managers          2024-25 lists 20 managers as FPL "players"
#   small_sample      rate rankings need a minimum sample
#   rate_definition   what counts as an appearance
#   precision         close values; early rounding changes the order
#   missing_data      not recorded for some seasons (NULL, not 0)
#   knowledge_vs_data the model's memory disagrees with this data
#   ties              more than one right answer at the top
#   time_grain        calendar time buckets
