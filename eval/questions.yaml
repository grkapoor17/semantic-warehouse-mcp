# ---------------------------------------------------------------- team-level vs player-level
- id: q30
  question: "How many league goals did Arsenal score in 2023-24?"
  answer_type: number
  gold_sql: |
    select sum(case when h.team_name = 'Arsenal' then home_goals else away_goals end) as value
    from marts.fct_fixtures x
    join marts.dim_teams h on h.team_code = x.home_team_code
    join marts.dim_teams a on a.team_code = x.away_team_code
    where season = '2023-24' and 'Arsenal' in (h.team_name, a.team_name)
  path: sql
  tags: [own_goals, team_vs_player]
  why: "Their players scored 85; the club scored 91 (6 opponent own goals)."

- id: q31
  question: "Which club conceded the fewest league goals in 2024-25, and how many?"
  answer_type: entity
  top: 1
  require_value: true
  gold_sql: |
    select t.team_name, sum(case when x.home_team_code = t.team_code then away_goals else home_goals end) as value
    from marts.fct_fixtures x join marts.dim_teams t on t.team_code in (x.home_team_code, x.away_team_code)
    where season = '2024-25' group by t.team_name order by value asc
  path: sql
  tags: [team_vs_player]
  why: "Summing players' goals_conceded counts each goal once per player on the pitch (Arsenal: 374 vs 34)."

- id: q32
  question: "What was Liverpool's goal difference in 2019-20?"
  answer_type: number
  gold_sql: |
    select sum(case when h.team_name = 'Liverpool' then home_goals - away_goals else away_goals - home_goals end) as value
    from marts.fct_fixtures x
    join marts.dim_teams h on h.team_code = x.home_team_code
    join marts.dim_teams a on a.team_code = x.away_team_code
    where season = '2019-20' and 'Liverpool' in (h.team_name, a.team_name)
  path: sql
  tags: [team_vs_player]
  why: "Match-level, both home and away."

- id: q33
  question: "How many league matches did Manchester City win in 2017-18?"
  answer_type: number
  gold_sql: |
    select count(*) as value
    from marts.fct_fixtures x
    join marts.dim_teams h on h.team_code = x.home_team_code
    join marts.dim_teams a on a.team_code = x.away_team_code
    where season = '2017-18' and ((h.team_name = 'Man City' and home_goals > away_goals) or (a.team_name = 'Man City' and away_goals > home_goals))
  path: sql
  tags: [team_vs_player, name_mismatch, grain]
  why: "Counting player rows with result = 'W' counts each win ~14 times."

- id: q34
  question: "How many clean sheets did Liverpool keep as a team in 2018-19?"
  answer_type: number
  gold_sql: |
    select count(*) as value
    from marts.fct_fixtures x
    join marts.dim_teams h on h.team_code = x.home_team_code
    join marts.dim_teams a on a.team_code = x.away_team_code
    where season = '2018-19' and ((h.team_name = 'Liverpool' and away_goals = 0) or (a.team_name = 'Liverpool' and home_goals = 0))
  path: sql
  tags: [team_vs_player]
  why: "The clean_sheets metric is per player (needs 60+ minutes); summing it multiplies the answer."

