# semantic-warehouse-mcp eval: 50 questions over the FPL example warehouse (2016-17 to 2026-27 GW6).
#
# Each question has a GOLD answer computed by hand-written SQL against the marts tables (never by the
# server's own metric compiler, so the eval can't grade the compiler with itself). Gold SQL uses stable
# player_code / team names so it doesn't depend on name matching. Run `python eval/build_gold.py` to
# compute eval/gold.json.
#
# Fields
#   question     what the agent is asked, verbatim
#   answer_type  number | text | entity | ranking | set | table | unavailable
#                  number      one value; gold_sql returns column `value`
#                  text        one string (a season, a month); column `value`
#                  entity      one player/team; columns `player_code` or `team_name`, plus `value`; top row wins
#                  ranking     ordered top-N (`top`); same columns as entity
#                  set         unordered group (e.g. a tie); every row returned is in the set
#                  table       several labelled values; columns `key`, `value`
#                  unavailable the data doesn't contain it; the agent should say so, not invent a number
#   top          for entity/ranking: how many rows count (the build checks for ties at the cut-off)
#   tolerance    absolute tolerance for numbers (default 0 for integers, 0.01 otherwise)
#   path         metrics = answerable with query_metrics alone; sql = needs run_query (no metric covers it)
#   tags         the trap(s) it tests (see the list at the bottom)
#   why          one line on what makes it hard

questions:

# ---------------------------------------------------------------- warm-up: plain lookups and totals
- id: q01
  question: "How many FPL points did Mohamed Salah score in the 2024-25 season?"
  answer_type: number
  gold_sql: select sum(total_points) as value from marts.fct_player_fixtures where player_code = 118748 and season = '2024-25'
  path: metrics
  tags: [warmup]
  why: "Baseline. Should be easy for every setup."

- id: q02
  question: "Who scored the most FPL points in the 2023-24 season?"
  answer_type: entity
  top: 1
  gold_sql: |
    select player_code, sum(total_points) as value from marts.fct_player_fixtures
    where season = '2023-24' group by player_code order by value desc
  path: metrics
  tags: [warmup]
  why: "Baseline ranking."

- id: q03
  question: "How many goals were scored in total in the 2023-24 Premier League season?"
  answer_type: number
  gold_sql: select sum(home_goals + away_goals) as value from marts.fct_fixtures where season = '2023-24'
  path: metrics
  tags: [own_goals, team_vs_player]
  why: "Summing player goals misses own goals; the match table has the true total."

- id: q04
  question: "What was the average number of goals per match in 2018-19?"
  answer_type: number
  tolerance: 0.01
  gold_sql: select avg(home_goals + away_goals) as value from marts.fct_fixtures where season = '2018-19'
  path: metrics
  tags: [team_vs_player]
  why: "Per-match average must come from matches, not player rows."

- id: q05
  question: "How many matches of the 2026-27 season are in the data so far?"
  answer_type: number
  gold_sql: select count(*) as value from marts.fct_fixtures where season = '2026-27'
  path: metrics
  tags: [warmup, grain]
  why: "Counting player rows instead of matches overcounts by ~25x."

- id: q06
  question: "Which club's players scored the most combined FPL points in 2025-26?"
  answer_type: entity
  top: 1
  gold_sql: |
    select team_name, sum(total_points) as value from marts.fct_player_fixtures
    where season = '2025-26' group by team_name order by value desc
  path: metrics
  tags: [warmup]
  why: "Per-fixture club (not end-of-season club) is the right attribution."

- id: q07
  question: "How many FPL assists did Kevin De Bruyne record in 2019-20?"
  answer_type: number
  gold_sql: select sum(assists) as value from marts.fct_player_fixtures where player_code = 61366 and season = '2019-20'
  path: metrics
  tags: [warmup, knowledge_vs_data]
  why: "The answer must come from the data, not from remembered real-world stats."

- id: q08
  question: "Who were the top 5 goalscorers in 2022-23?"
  answer_type: ranking
  top: 5
  gold_sql: |
    select player_code, sum(goals) as value from marts.fct_player_fixtures
    where season = '2022-23' group by player_code order by value desc
  path: metrics
  tags: [warmup]
  why: "Baseline top-N."

- id: q09
  question: "How many yellow cards has Bruno Fernandes received across all seasons in the data?"
  answer_type: number
  gold_sql: select sum(yellow_cards) as value from marts.fct_player_fixtures where player_code = 141746
  path: metrics
  tags: [name_mismatch, cross_season]
  why: "His full name in the data is \"Bruno Borges Fernandes\", so an exact match on \"Bruno Fernandes\" finds nothing."

- id: q10
  question: "Which completed season had the highest home win rate?"
  answer_type: text
  gold_sql: |
    select season as value from marts.fct_fixtures where season < '2026-27'
    group by season order by avg(case when home_goals > away_goals then 1.0 else 0 end) desc limit 1
  path: metrics
  tags: [team_vs_player]
  why: "Needs match-level results and excluding the in-progress season."

