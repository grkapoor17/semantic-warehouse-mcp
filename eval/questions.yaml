  why: "The data spells it \"Groß\"; ilike '%gross%' doesn't match \"ß\"."

- id: q19
  question: "How many FPL points did Son score in 2021-22?"
  answer_type: number
  gold_sql: select sum(total_points) as value from marts.fct_player_fixtures where player_code = 85971 and season = '2021-22'
  path: metrics
  tags: [name_mismatch]
  why: "The text \"son\" is inside many names (Wilson, Robertson, ...); needs Son Heung-min specifically."

- id: q20
  question: "How many FPL points has Aaron Ramsey scored in this data?"
  answer_type: table
  gold_sql: |
    select p.player_name || ' (' || string_agg(distinct f.team_name, '/' order by f.team_name) || ')' as key, sum(f.total_points) as value
    from marts.fct_player_fixtures f join marts.dim_players p using (player_code)
    where f.player_code in (41792, 447715) group by p.player_code, p.player_name order by key
  path: metrics
  tags: [ambiguous_person]
  why: "Two different Aaron Ramseys (ex-Arsenal; Burnley/Villa). Summing them gives 295; correct = report both separately."

- id: q21
  question: "How many FPL points has Danny Ward scored in total?"
  answer_type: table
  gold_sql: |
    select p.player_name || ' (' || string_agg(distinct f.team_name, '/' order by f.team_name) || ')' as key, sum(f.total_points) as value
    from marts.fct_player_fixtures f join marts.dim_players p using (player_code)
    where f.player_code in (95463, 75826) group by p.player_code, p.player_name order by key
  path: metrics
  tags: [ambiguous_person]
  why: "Two different Danny Wards (goalkeeper; forward). Summing them is wrong."

- id: q22
  question: "How many league goals did Manchester United score in 2020-21?"
  answer_type: number
  gold_sql: |
    select sum(case when h.team_name = 'Man Utd' then home_goals else away_goals end) as value
    from marts.fct_fixtures x
    join marts.dim_teams h on h.team_code = x.home_team_code
    join marts.dim_teams a on a.team_code = x.away_team_code
    where season = '2020-21' and 'Man Utd' in (h.team_name, a.team_name)
  path: sql
  tags: [name_mismatch, own_goals, team_vs_player]
  why: "The club is \"Man Utd\" in the data, and team goals include opponents' own goals."

