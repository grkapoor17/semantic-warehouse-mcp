# ---------------------------------------------------------------- rates and minimum samples
- id: q41
  question: "Who had the best FPL points per 90 minutes in 2024-25?"
  answer_type: entity
  top: 1
  gold_sql: |
    select player_code, sum(total_points) * 90.0 / sum(minutes_played) as value from marts.fct_player_fixtures
    where season = '2024-25' group by player_code having sum(minutes_played) >= 900 order by value desc
  path: metrics
  tags: [small_sample]
  why: "No minimum: 1-minute players score 90.0 per 90. Any minimum of 450+ minutes (5 full matches) gives Salah; below that, short stints like Danny Ings (270 min) win."

- id: q42
  question: "Among players with at least 2,000 minutes in 2024-25, who were the top 3 by FPL points per 90 minutes?"
  answer_type: ranking
  top: 3
  tolerance: 0.01
  gold_sql: |
    select player_code, sum(total_points) * 90.0 / sum(minutes_played) as value from marts.fct_player_fixtures
    where season = '2024-25' group by player_code having sum(minutes_played) >= 2000 order by value desc
  path: metrics
  tags: [small_sample, precision]
  why: "2nd and 3rd are 6.885 vs 6.883; rounding too early swaps them."

- id: q43
  question: "Across all seasons, does Mohamed Salah average more FPL points per appearance at home or away? Give both numbers."
  answer_type: table
  tolerance: 0.01
  gold_sql: |
    select case when was_home then 'home' else 'away' end as key,
           sum(total_points) * 1.0 / count(*) filter (where minutes_played > 0) as value
    from marts.fct_player_fixtures where player_code = 118748 group by was_home order by key
  path: metrics
  tags: [cross_season, rate_definition]
  why: "Appearances = matches with 1+ minute, not every listed fixture."

- id: q44
  question: "Which defender had the most FPL points per appearance in 2023-24, with at least 20 appearances?"
  answer_type: entity
  top: 1
  tolerance: 0.01
  gold_sql: |
    select player_code, sum(total_points) * 1.0 / count(*) filter (where minutes_played > 0) as value
    from marts.fct_player_fixtures where season = '2023-24' and position = 'DEF'
    group by player_code having count(*) filter (where minutes_played > 0) >= 20 order by value desc
  path: metrics
  tags: [small_sample]
  why: "Needs both a position filter and an appearance threshold."

